<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MX-Оазис 3D — Неоновый мегаполис</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:system-ui,-apple-system,sans-serif; background:#FAF9F5; color:#141413; overflow:hidden; height:100vh; }
    #ui-book { position:fixed; inset:0; z-index:20; background:#FAF9F5; display:none; flex-direction:column; padding:20px 16px; max-width:560px; margin:0 auto; }
    .brand { font-size:13px; font-weight:800; color:#D97757; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
    h1 { font-size:22px; font-weight:800; letter-spacing:-0.02em; margin-bottom:6px; }
    .sub { font-size:13px; color:#5E5D59; margin-bottom:12px; line-height:1.4; }
    textarea { flex:1; width:100%; border:1px solid #E5E2D9; border-radius:14px; padding:14px; font-size:14px; line-height:1.5; background:#FFF; color:#141413; resize:none; margin-bottom:12px; outline:none; }
    textarea:focus { border-color:#D97757; }
    .row { display:flex; gap:8px; }
    .btn-main { flex:2; padding:14px; border-radius:12px; border:none; background:#D97757; color:#FFF; font-size:15px; font-weight:700; cursor:pointer; }
    .btn-sec { flex:1; padding:14px; border-radius:12px; border:1px solid #E5E2D9; background:#FFF; color:#141413; font-size:13px; font-weight:700; cursor:pointer; }
    #ui-world { position:fixed; inset:0; display:none; background:#1E1B4B; }
    .hud-top { position:fixed; top:12px; left:12px; right:12px; z-index:10; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
    .pill { background:rgba(20,20,19,0.72); border:1px solid rgba(255,255,255,0.25); color:#FAF9F5; padding:7px 12px; border-radius:999px; font-size:12px; font-weight:700; pointer-events:auto; cursor:pointer; }
    #npc-speech { position:fixed; top:56px; left:12px; right:12px; z-index:10; max-width:440px; margin:0 auto; background:rgba(250,249,245,0.95); color:#141413; border-left:4px solid #D97757; border-radius:12px; padding:10px 14px; font-size:13px; line-height:1.4; box-shadow:0 8px 24px rgba(0,0,0,0.25); display:none; }
    #joy-zone { position:fixed; bottom:24px; left:24px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.45); z-index:10; touch-action:none; }
    #joy-stick { position:absolute; top:35px; left:35px; width:40px; height:40px; border-radius:50%; background:#D97757; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
    #act-btn { position:fixed; bottom:34px; right:24px; width:84px; height:84px; border-radius:50%; border:2px solid #FFF; background:#D97757; color:#FFF; font-size:13px; font-weight:800; z-index:10; cursor:pointer; box-shadow:0 4px 16px rgba(217,119,87,0.5); }
    #vn-modal { position:fixed; inset:0; z-index:30; background:rgba(15,23,42,0.65); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:16px; }
    .vn-card { width:100%; max-width:420px; background:#FAF9F5; color:#141413; border-radius:18px; padding:18px; border-top:4px solid #D97757; box-shadow:0 16px 40px rgba(0,0,0,0.45); }
    .vn-title { font-size:16px; font-weight:800; margin-bottom:8px; color:#141413; }
    .vn-text { font-size:14px; line-height:1.45; color:#4A4945; margin-bottom:14px; }
    .vn-opt { width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border-radius:12px; border:1px solid #E5E2D9; background:#FFF; color:#141413; font-size:13px; font-weight:700; cursor:pointer; }
    .vn-opt:hover { border-color:#D97757; background:#FFF7F3; }
    #chat-bar { position:fixed; bottom:16px; left:144px; right:116px; z-index:12; display:flex; gap:6px; align-items:center; }
    #chat-in { flex:1; min-width:0; padding:10px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.3); background:rgba(20,20,19,0.82); color:#FAF9F5; font-size:13px; outline:none; }
    #chat-send { padding:10px 14px; border-radius:999px; border:none; background:#D97757; color:#FFF; font-size:12px; font-weight:800; cursor:pointer; }
  </style>


</head>
<body>
  <div id="ui-book">
    <div class="brand">MXPro 5.0 • Anime 3D World Engine</div>
    <h1>Сценарный промпт 3D-мира</h1>
    <div class="sub">Опишите сцену без «воды» (до 1 000 знаков): погода, место, имена героев и их фразы в «кавычках».</div>
    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
      <button class="pill" onclick="setPreset(0)">Закат у моря</button>
      <button class="pill" onclick="setPreset(1)">Зимний лес</button>
      <button class="pill" onclick="setPreset(2)">Ночной неон</button>
    </div>
    <textarea id="book-text" maxlength="1000" oninput="updCnt()">Тёплый летний закат над тихим городком у моря...</textarea>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#5E5D59;margin:-6px 2px 10px;">
      <span id="char-cnt">0 / 1 000 знаков</span>
      <span id="ai-stat" style="font-weight:700;color:#15803D;"></span>
      <span style="color:#D97757;cursor:pointer;font-weight:700;" onclick="clearPrompt()">Очистить</span>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <button class="btn-sec" id="btn-or" style="border-color:#D97757;color:#D97757;" onclick="genSectorViaKey()">ИИ-генерация (Ключ)</button>
      <button class="btn-sec" onclick="document.getElementById('file-txt').click()">Текст .txt</button>
      <button class="btn-sec" onclick="document.getElementById('file-bg').click()">Панорама .jpg</button>
    </div>
    <div class="row">
      <button class="btn-main" onclick="buildWorld()">Войти в сектор</button>
    </div>

    <input type="file" id="file-txt" accept=".txt" style="display:none" onchange="loadTxtFile(event)" />
    <input type="file" id="file-bg" accept="image/*" style="display:none" onchange="loadBgArt(event)" />

  </div>


  <div id="ui-world">
    <div class="hud-top" style="flex-wrap:wrap;gap:6px;">
      <a href="step.html" class="pill" style="text-decoration:none;">← MX-Step</a>
      <div class="pill" id="hud-stat">MX-Оазис • Площадь</div>
      <div class="pill" style="background:#D97757;border-color:#D97757;" onclick="backToBook()">+ Моя локация</div>
      <div class="pill" onclick="openPortals()">Порталы</div>
      <div class="pill" id="status-pill" onclick="toggleMyStatus()" style="display:flex;align-items:center;gap:6px;"><span id="st-dot" style="width:9px;height:9px;border-radius:50%;background:#38BDF8;display:inline-block;"></span><span id="st-txt">Общение</span></div>
    </div>

    <div id="npc-speech"></div>
    <div id="joy-zone"><div id="joy-stick"></div></div>
    <div id="chat-bar">
      <input id="chat-in" maxlength="80" placeholder="Сказать в чат площади..." onkeydown="if(event.key==='Enter')sendBubbleChat()" />
      <button id="chat-send" onclick="sendBubbleChat()">Сказать</button>
    </div>
    <button id="act-btn" onclick="triggerAction()">ДЕЙСТВИЕ</button>

    <div id="vn-modal"><div class="vn-card"><div class="vn-title" id="vn-t"></div><div class="vn-text" id="vn-b"></div><div id="vn-opts"></div></div></div>
  </div>

  <script>
    let player = { x: 0, z: 8 }, npcs = [], move = { x: 0, z: 0 }, animId = null, isNight = false;
    const SPR = {};
    function loadCleanSprite(key, src, cutBg) {
      const im = new Image();
      im.onload = () => {
        if (!cutBg) { SPR[key] = im; return; }
        const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0);
        const w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), p = d.data;
        const vis = new Uint8Array(w * h), q = [0, w - 1, (h - 1) * w, w * h - 1];
        const lum = idx => (p[idx * 4] + p[idx * 4 + 1] + p[idx * 4 + 2]) / 3;
        while (q.length) {
          const idx = q.pop();
          if (idx < 0 || idx >= w * h || vis[idx] || lum(idx) < 205) continue;
          vis[idx] = 1; p[idx * 4 + 3] = lum(idx) > 232 ? 0 : Math.round((232 - lum(idx)) * 6);
          const x = idx % w;
          if (x > 0) q.push(idx - 1); if (x < w - 1) q.push(idx + 1);
          q.push(idx - w, idx + w);
        }
        g.putImageData(d, 0, 0);
        let x0 = w, y0 = h, x1 = 0, y1 = 0;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (p[(y * w + x) * 4 + 3] > 20) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
        if (x1 > x0 && y1 > y0) {
          const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
          out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
          SPR[key] = out;
        } else SPR[key] = c;
      };
      im.src = src + '?v=3';
    }

    loadCleanSprite('hero', 'hero.png', true);
    loadCleanSprite('npc1', 'npc1.png', true);
    loadCleanSprite('npc2', 'npc2.png', true);
    loadCleanSprite('house', 'house.png', true);
    loadCleanSprite('school', 'school.png', true);
    loadCleanSprite('kiber', 'kiber.png', true);
    loadCleanSprite('castle', 'castle.png', true);
    loadCleanSprite('station', 'station.png', true);
    loadCleanSprite('tree', 'tree.png', true);
    loadCleanSprite('tower', 'tower.png', false);


    const PRESETS = [
      'Тёплый летний закат у моря. По улочке кружатся лепестки сакуры. Пекарь Артур у пекарни говорит: «Свежие булочки с корицей уже готовы!». Художник Алиса у фонаря улыбается: «Какой золотой свет над заливом!».',
      'Морозный зимний вечер у старой станции. Падает пушистый снег. Смотритель Марк у тоннеля предупреждает: «Тропа заметена, держитесь ближе к огням!». Путешественник Елена шепчет: «Ключ от ворот спрятан у старой ели».',
      'Ночной неоновый проспект после дождя. В воздухе летят золотые искры. Детектив Виктор у шлюза сообщает: «Центральный банк взломан, периметр перекрыт!». Информатор Кира тихо говорит: «Через старый тоннель можно пройти без досмотра».'
    ];
    function updCnt() { const el = document.getElementById('book-text'); document.getElementById('char-cnt').textContent = `${el.value.length} / 1 000 знаков`; }
    function clearPrompt() { document.getElementById('book-text').value = ''; updCnt(); document.getElementById('ai-stat').textContent = ''; }
    function loadAiPanorama(idea) {
      const p = encodeURIComponent('Utopia futuristic anime city skyline sunset clouds, Makoto Shinkai and Studio Ghibli art style, wide panoramic background, no people, no text, ' + idea);
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { SPR.customBg = im; const st = document.getElementById('ai-stat'); if (st) st.textContent += ' + Арт-панорама готова'; };
      im.src = 'https://image.pollinations.ai/prompt/' + p + '?width=1280&height=540&nologo=true&seed=' + Math.floor(Math.random() * 9999);
    }
    async function genSectorViaKey() {
      const box = document.getElementById('book-text'), st = document.getElementById('ai-stat'), btn = document.getElementById('btn-or');
      const idea = box.value.trim() || 'Утопия город будущего на закате';
      btn.textContent = 'Генерация мира...'; btn.disabled = true; st.textContent = 'Рисуем панораму...';
      loadAiPanorama(idea);
      try {
        const res = await fetch('https://mx-pro.streamlit.app/?ai_idea=' + encodeURIComponent(idea));

        const html = await res.text();
        const m = html.match(/id=['"]mx-ai-res['"]>(\{.*?\})<\/div>/);
        if (m) {
          const data = JSON.parse(m[1]);
          box.value = `${data.title || idea}. ${data.text} Герой говорит: «${data.btn || 'Добро пожаловать в новый сектор!'}».`.slice(0, 1000);
          st.style.color = '#15803D'; st.textContent = 'OpenRouter API: Сценарий готов';
        } else throw new Error('no-tag');
      } catch (e) {
        box.value = `Неоновый город будущего «${idea}» на закате. В воздухе летят золотые блики. Архитектор Лира у башни говорит: «Этот сектор построен по твоему замыслу!».`.slice(0, 1000);
        st.style.color = '#D97757'; st.textContent = 'Ядро MXPro: Сценарий готов';
      }
      updCnt(); btn.textContent = 'ИИ-генерация (Ключ)'; btn.disabled = false;
    }

    function setPreset(i) { document.getElementById('book-text').value = PRESETS[i]; updCnt(); }
    setTimeout(updCnt, 50);
    function loadTxtFile(e) { const f = e.target.files.item(0); if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById('book-text').value = r.result.slice(0, 1000); updCnt(); }; r.readAsText(f); }
    function loadBgArt(e) {
      const f = e.target.files.item(0); if (!f) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { SPR.customBg = im; }; im.src = r.result; };
      r.readAsDataURL(f);
    }
    function backToBook() { if (animId) cancelAnimationFrame(animId); document.getElementById('ui-world').style.display = 'none'; document.getElementById('ui-book').style.display = 'flex'; }


    function drawAnimeChar(cx, x, y, s, coatCol, hairCol, name, t, phase) {
      const bob = Math.sin(t * 0.005 + phase) * s * 0.06;
      cx.fillStyle = 'rgba(20,15,35,0.28)'; cx.beginPath(); cx.ellipse(x, y, s * 0.42, s * 0.14, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = coatCol; cx.beginPath(); cx.roundRect(x - s * 0.28, y - s * 1.15 + bob, s * 0.56, s * 1.1, s * 0.14); cx.fill();
      cx.strokeStyle = '#1E1B4B'; cx.lineWidth = 2; cx.stroke();
      cx.fillStyle = '#FDE6D8'; cx.beginPath(); cx.arc(x, y - s * 1.42 + bob, s * 0.27, 0, Math.PI * 2); cx.fill(); cx.stroke();
      cx.fillStyle = hairCol; cx.beginPath(); cx.arc(x, y - s * 1.48 + bob, s * 0.29, Math.PI * 0.9, Math.PI * 2.1); cx.fill();
      if (name) { cx.fillStyle = '#FFF'; cx.font = 'bold ' + Math.max(11, Math.min(15, s * 0.34)) + 'px system-ui'; cx.textAlign = 'center'; cx.fillText(name, x, y - s * 1.88 + bob); }
    }
    let myStatus = 'chat', myBubble = { txt: '', until: 0 };
    function setMyStatus(st) {
      myStatus = st;
      document.getElementById('st-dot').style.background = st === 'chat' ? '#38BDF8' : '#22C55E';
      document.getElementById('st-txt').textContent = st === 'chat' ? 'Общение' : 'Занят';
    }
    function toggleMyStatus() { setMyStatus(myStatus === 'chat' ? 'busy' : 'chat'); }
    document.addEventListener('visibilitychange', () => setMyStatus(document.hidden ? 'busy' : 'chat'));
    function sendBubbleChat() {
      const inp = document.getElementById('chat-in'), v = inp.value.trim();
      if (!v) return;
      myBubble = { txt: v, until: performance.now() + 6500 };
      inp.value = ''; setMyStatus('chat');
    }
    function drawBubble(cx, x, y, txt, st) {
      cx.fillStyle = st === 'busy' ? '#22C55E' : '#38BDF8';
      cx.beginPath(); cx.arc(x, y, 5.5, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = '#FFF'; cx.lineWidth = 1.5; cx.stroke();
      if (!txt) return;
      cx.font = 'bold 12px system-ui';
      const w = Math.min(220, cx.measureText(txt).width + 20);
      cx.fillStyle = 'rgba(250,249,245,0.95)';
      cx.beginPath(); cx.roundRect(x - w / 2, y - 34, w, 24, 12); cx.fill();
      cx.fillStyle = '#141413'; cx.textAlign = 'center'; cx.fillText(txt.slice(0, 28), x, y - 18);
    }
    let biome = 'sunset', lastSpoken = '';

    function speakLine(txt, idx) {
      if (!('speechSynthesis' in window) || lastSpoken === txt) return;
      lastSpoken = txt; speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU'; u.pitch = idx % 2 === 0 ? 1.15 : 0.88; u.rate = 1.04;
      speechSynthesis.speak(u);
    }
    function makeRoadTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#090D16'; g.fillRect(0, 0, 512, 512);
      for (let y = 0; y < 512; y += 32) {
        const off = (y / 32) % 2 ? 16 : 0;
        for (let x = -16; x < 512; x += 32) {
          g.fillStyle = ((x + y) % 64 === 0) ? '#131C31' : '#0F172A';
          g.fillRect(x + off + 2, y + 2, 28, 28);
        }
      }
      g.strokeStyle = 'rgba(56,189,248,0.45)'; g.lineWidth = 3; g.strokeRect(12, 12, 488, 488);
      g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.fillStyle = '#FDE047';
      g.fillText('ЦЕНТРАЛЬНАЯ ПЛОЩАДЬ • MX-ОАЗИС', 256, 46);
      const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(5, 5);
      return tx;
    }
    function makeSpaceTex() {
      const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 0, 1024);
      bg.addColorStop(0, '#02040a'); bg.addColorStop(0.55, '#0b1026'); bg.addColorStop(0.85, '#1e1b4b'); bg.addColorStop(1, '#4c1d95');
      g.fillStyle = bg; g.fillRect(0, 0, 2048, 1024);
      g.save(); g.translate(1024, 340); g.rotate(-0.28);
      const mw = g.createLinearGradient(0, -90, 0, 90);
      mw.addColorStop(0, 'rgba(56,189,248,0)'); mw.addColorStop(0.5, 'rgba(199,210,254,0.26)'); mw.addColorStop(1, 'rgba(244,114,182,0)');
      g.fillStyle = mw; g.fillRect(-1200, -90, 2400, 180);
      for (let i = 0; i < 900; i++) {
        g.fillStyle = i % 3 === 0 ? 'rgba(255,255,255,0.85)' : 'rgba(186,230,253,0.55)';
        g.fillRect((Math.sin(i * 12.9) * 1100), (Math.cos(i * 7.3) * 75), (i % 2) + 1.2, (i % 2) + 1.2);
      }
      g.restore();
      for (let s = 0; s < 650; s++) {
        g.fillStyle = s % 5 === 0 ? '#fde047' : '#ffffff';
        g.fillRect((s * 317) % 2048, (s * 173) % 720, s % 4 === 0 ? 2.2 : 1.3, s % 4 === 0 ? 2.2 : 1.3);
      }
      const mx = 680, my = 240;
      const mg = g.createRadialGradient(mx, my, 10, mx, my, 95);
      mg.addColorStop(0, '#fef9c3'); mg.addColorStop(0.45, 'rgba(254,240,138,0.45)'); mg.addColorStop(1, 'rgba(254,240,138,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(mx, my, 95, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fef08a'; g.beginPath(); g.arc(mx, my, 38, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(161,98,7,0.22)'; g.beginPath(); g.arc(mx - 10, my - 8, 9, 0, Math.PI * 2); g.arc(mx + 12, my + 7, 7, 0, Math.PI * 2); g.fill();
      const px = 1320, py = 220;
      const pg = g.createLinearGradient(px - 60, py - 60, px + 60, py + 60);
      pg.addColorStop(0, '#38bdf8'); pg.addColorStop(0.55, '#818cf8'); pg.addColorStop(1, '#1e1b4b');
      g.fillStyle = pg; g.beginPath(); g.arc(px, py, 56, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(244,114,182,0.75)'; g.lineWidth = 8;
      g.beginPath(); g.ellipse(px, py, 105, 22, -0.35, 0, Math.PI * 2); g.stroke();
      return new THREE.CanvasTexture(c);
    }
    function makeTowerTex(seed, ruText, jpText, col) {
      const c = document.createElement('canvas'); c.width = 256; c.height = 512;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 512);
      gr.addColorStop(0, '#020617'); gr.addColorStop(1, '#0f172a');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 512);
      for (let y = 16; y < 496; y += 14) for (let x = 14; x < 240; x += 18) {
        const rnd = (x * 11 + y * 7 + seed * 29) % 13;
        g.fillStyle = rnd === 0 ? '#38bdf8' : (rnd === 1 ? '#f472b6' : (rnd === 2 ? '#fde047' : '#1e293b'));
        g.fillRect(x, y, 12, 8);
      }
      g.fillStyle = col; g.fillRect(4, 0, 4, 512); g.fillRect(248, 0, 4, 512);
      g.fillStyle = 'rgba(6,9,19,0.92)'; g.fillRect(18, 220, 220, 58);
      g.strokeStyle = col; g.lineWidth = 4; g.strokeRect(18, 220, 220, 58);
      g.fillStyle = '#fff'; g.font = 'bold 19px system-ui'; g.textAlign = 'center'; g.fillText(ruText, 128, 255);
      g.fillStyle = col; g.font = 'bold 24px system-ui'; g.fillText(jpText, 226, 76); g.fillText('未来', 226, 108);
      return new THREE.CanvasTexture(c);
    }



    function buildWorld() {
      document.getElementById('ui-book').style.display = 'none';
      const wBox = document.getElementById('ui-world'); wBox.style.display = 'block';
      wBox.querySelectorAll('canvas').forEach(c => c.remove());
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x060913, 0.011);
      const cam = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 260);
      const ren = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      ren.setSize(innerWidth, innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio, 2));
      wBox.appendChild(ren.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const dL = new THREE.DirectionalLight(0x38bdf8, 1.1); dL.position.set(14, 30, 18); scene.add(dL);
      const skyDome = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 20), new THREE.MeshBasicMaterial({ map: makeSpaceTex(), side: THREE.BackSide }));
      scene.add(skyDome);
      const plaza = new THREE.Mesh(new THREE.PlaneGeometry(42, 42), new THREE.MeshStandardMaterial({ map: makeRoadTex(), roughness: 0.42 }));
      plaza.rotation.x = -Math.PI / 2; scene.add(plaza);
      const towers = [
        [-16, -12, 'БАР «НЕОН»', '酒場', '#F472B6'], [-16, 0, 'КАФЕ «САКУРА»', '喫茶', '#38BDF8'], [-16, 12, 'БУТИК ОДЕЖДЫ', '衣装', '#FDE047'],
        [16, -12, 'НОЧНОЙ КЛУБ «АКСИС»', 'クラブ', '#F472B6'], [16, 0, 'САЛОН СМАРТФОНОВ', '電脳', '#38BDF8'], [16, 12, 'ЛАВКА АРТЕФАКТОВ', '宝石', '#A855F7'],
        [-7, -18, 'ПОРТАЛ МИРОВ', '転送', '#38BDF8'], [7, -18, 'ПАЛАТА ЛИЦЕНЗИЙ', '免許', '#FDE047']
      ];
      towers.forEach(([bx, bz, ruT, jpT, col], i) => {
        const bh = 28 + (i % 3) * 10;
        const bM = new THREE.Mesh(new THREE.BoxGeometry(7.2, bh, 8.2), new THREE.MeshStandardMaterial({ map: makeTowerTex(i, ruT, jpT, col) }));
        bM.position.set(bx, bh / 2, bz); scene.add(bM);
        const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.35, 8), new THREE.MeshBasicMaterial({ color: col }));
        spire.position.set(bx, bh + 4, bz); scene.add(spire);
        if (Math.abs(bx) === 16) {
          const sx = bx < 0 ? -11.2 : 11.2;
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.8), new THREE.MeshBasicMaterial({ color: 0x334155 }));
          const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
          post.position.set(sx, 1.9, bz - 2.6); lamp.position.set(sx, 3.9, bz - 2.6);
          const bench = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.42, 2.2), new THREE.MeshStandardMaterial({ color: 0x78350f }));
          bench.position.set(sx, 0.21, bz + 1.2);
          const trk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 2.3), new THREE.MeshBasicMaterial({ color: 0x451a03 }));
          const cr = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 10), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xf472b6 : 0x38bdf8 }));
          trk.position.set(sx, 1.15, bz + 3.4); cr.position.set(sx, 3.1, bz + 3.4);
          scene.add(post, lamp, bench, trk, cr);
        }
      });
      const desk = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.15, 1.2), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      desk.position.set(0, 0.58, -9);
      const deskSign = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.55, 0.2), new THREE.MeshBasicMaterial({ map: makeTowerTex(1, 'ИНФОРМАЦИЯ • FAQ', '案内', '#38BDF8') }));
      deskSign.position.set(0, 2.75, -9); scene.add(desk, deskSign);
      const shard = new THREE.Mesh(new THREE.OctahedronGeometry(0.45), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      shard.position.set(-7.5, 1.1, 6.5); scene.add(shard);
      function makeCharPlane(key, h, tintHex) {
        const sp = SPR[key], tex = sp ? new THREE.CanvasTexture(sp) : null, asp = sp ? (sp.width / sp.height) : 0.55;
        const grp = new THREE.Group();
        const m = new THREE.Mesh(new THREE.PlaneGeometry(h * asp, h), new THREE.MeshBasicMaterial({ map: tex, color: tex ? (tintHex || 0xffffff) : 0xd97757, transparent: true, alphaTest: 0.08, side: THREE.DoubleSide }));
        m.position.y = h / 2 + 0.05;
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.58, 24), new THREE.MeshBasicMaterial({ color: tintHex || 0x38bdf8, side: THREE.DoubleSide }));
        ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
        grp.add(m, ring); return grp;
      }
      function makeCopMesh(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.52, 12, 12), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
        body.scale.set(1.1, 1.45, 0.95); body.position.y = 1.05;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: 0xfde6d8 })); head.position.y = 1.95;
        const glasses = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 0.14), new THREE.MeshBasicMaterial({ color: 0x020617 })); glasses.position.set(0, 1.98, 0.22);
        const donut = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.045, 8, 14), new THREE.MeshBasicMaterial({ color: 0xf472b6 })); donut.position.set(-0.38, 1.48, 0.35);
        const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.18, 10), new THREE.MeshBasicMaterial({ color: 0xfef3c7 })); cup.position.set(0.38, 1.45, 0.35);
        g.add(body, head, glasses, donut, cup); g.position.set(x, 0, z); scene.add(g); return g;
      }
      const cop1 = makeCopMesh(-2.8, 3.2), cop2 = makeCopMesh(-1.7, 3.4);
      const heroMesh = makeCharPlane('hero', 2.3, 0xffffff); scene.add(heroMesh);
      const walkers = [];
      const tints = [0xfef08a, 0xfbcfe8, 0xbae6fd, 0xd9f99d, 0xddd6fe, 0xfed7aa];
      for (let w = 0; w < 6; w++) {
        const wm = makeCharPlane(w % 2 ? 'npc2' : 'npc1', 2.25, tints[w]);
        wm.position.set((w - 3) * 2.8, 0, -4 + (w % 3) * 4.5); scene.add(wm);
        walkers.push({ m: wm, dir: w % 2 ? 1 : -1, sp: 0.009 + (w % 3) * 0.003 });
      }
      npcs = [
        { name: 'Офицер Пончик', mesh: cop1, isCop: true, x: -2.2, z: 3.3, lines: ['Соблюдайте правила MX-Оазиса. Добро пожаловать в мегаполис!', 'Отличный кофе сегодня в Сакуре, правда, напарник?'] },
        { name: 'Гид Стойки FAQ', mesh: makeCharPlane('npc2', 2.35, 0xbae6fd), isFaq: true, x: 0, z: -8.2, lines: ['Привет! Я бот-консультант MX-Оазиса. Нажми «ДЕЙСТВИЕ», чтобы открыть FAQ по игре!', 'Подсказка: в углу площади сияет Квантовый осколок с Синими Искрами.'] },
        { name: 'Бариста Сакуры', mesh: makeCharPlane('npc1', 2.35, 0xfbcfe8), x: -10.2, z: 0, lines: ['Заходи в Кафе «Сакура»! Угости друга кофе или купи пирожное.', 'С крыши соседнего небоскрёба открывается лучший вид на Млечный Путь!'] },
        { name: 'Охранник Клуба Аксис', mesh: makeCharPlane('npc1', 2.45, 0x94a3b8), x: 10.5, z: -10, lines: ['Ночной клуб «Аксис» открыт. Вход по пропуску или за Искры.', 'Соблюдайте порядок на площади — патруль рядом!'] }
      ];
      npcs.forEach(n => { if (!n.isCop) { n.mesh.position.set(n.x, 0, n.z); scene.add(n.mesh); } });
      let camYaw = 0, camPitch = 0.22, dragCam = false, lx = 0, ly = 0, copSpoken = false;
      ren.domElement.onmousedown = e => { dragCam = true; lx = e.clientX; ly = e.clientY; };
      ren.domElement.addEventListener('touchstart', e => { dragCam = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('mousemove', e => { if (!dragCam) return; camYaw -= (e.clientX - lx) * 0.006; camPitch = Math.max(-0.45, Math.min(0.95, camPitch + (e.clientY - ly) * 0.005)); lx = e.clientX; ly = e.clientY; });
      window.addEventListener('touchmove', e => { if (!dragCam) return; camYaw -= (e.touches[0].clientX - lx) * 0.007; camPitch = Math.max(-0.45, Math.min(0.95, camPitch + (e.touches[0].clientY - ly) * 0.006)); lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('mouseup', () => { dragCam = false; }); window.addEventListener('touchend', () => { dragCam = false; });
      player = { x: 0, z: 11, y: 0 }; let lastMc = 0; updHud();
      function loop(t) {
        animId = requestAnimationFrame(loop);
        skyDome.rotation.y = t * 0.000018;
        shard.rotation.y = t * 0.003; shard.position.y = 1.1 + Math.sin(t * 0.004) * 0.15;
        const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw), rgtX = Math.cos(camYaw), rgtZ = -Math.sin(camYaw);
        player.x = Math.max(-12, Math.min(12, player.x + (rgtX * move.x - fwdX * move.z) * 0.068));
        player.z = Math.max(-15, Math.min(15, player.z + (rgtZ * move.x - fwdZ * move.z) * 0.068));
        const walkBob = (Math.abs(move.x) + Math.abs(move.z) > 0.05) ? Math.abs(Math.sin(t * 0.009)) * 0.09 : Math.sin(t * 0.003) * 0.025;
        heroMesh.position.set(player.x, player.y + walkBob, player.z); heroMesh.rotation.y = camYaw;
        cam.position.set(player.x + Math.sin(camYaw) * 6.5, player.y + 2.6 + camPitch * 4.8, player.z + Math.cos(camYaw) * 6.5);
        cam.lookAt(player.x - Math.sin(camYaw) * 6, player.y + 2.2 - camPitch * 6.2, player.z - Math.cos(camYaw) * 6);
        npcs.forEach(n => { if (!n.isCop) n.mesh.rotation.y = camYaw; });
        walkers.forEach(w => { w.m.position.x += w.dir * w.sp; if (Math.abs(w.m.position.x) > 9.5) w.dir *= -1; w.m.rotation.y = camYaw; });
        if (t - lastMc > 100) {
          lastMc = t;
          const nearIdx = npcs.findIndex(n => Math.hypot(n.x - player.x, n.z - player.z) < 4.2);
          const box = document.getElementById('npc-speech');
          if (nearIdx >= 0) {
            const near = npcs[nearIdx], line = near.lines[Math.floor((t / 4500) % near.lines.length)];
            box.innerHTML = `<b>${near.name}</b> <span style="color:#D97757;font-size:11px;">• Площадь</span><br>${line}`;
            box.style.display = 'block';
            if (near.isCop && !copSpoken) { copSpoken = true; speakLine('Соблюдайте правила MX-Оазиса. Добро пожаловать в мегаполис!', 0); }
            else if (!near.isCop) speakLine(line, nearIdx);
          } else { box.style.display = 'none'; copSpoken = false; }
        }
        ren.render(scene, cam);
      }
      loop(0);
    }



    function openVnCard(title, body, opts) {
      document.getElementById('vn-t').textContent = title;
      document.getElementById('vn-b').textContent = body;
      const box = document.getElementById('vn-opts'); box.innerHTML = '';
      opts.forEach(o => {
        const b = document.createElement('button'); b.className = 'vn-opt'; b.textContent = o.label;
        b.onclick = () => { document.getElementById('vn-modal').style.display = 'none'; if (o.fn) o.fn(); };
        box.appendChild(b);
      });
      document.getElementById('vn-modal').style.display = 'flex';
    }
    let curLoc = 'street', INV = [];
    const WORLD_MAP = {
      street: { title: 'Главная улочка', exitHint: 'Слева дверь в Пекарню, справа вход в Переулок, впереди Тоннель к морю.', npcs: [] },
      bakery: { title: 'Уютная пекарня', exitHint: 'Внутри пахнет свежей выпечкой. У прилавка стоит Хозяин пекарни.', npcs: [{ name: 'Хозяин пекарни', spr: 'npc1', coat: '#D97757', hair: '#78350F', x: 0, z: -6, item: 'Тёплая булочка', lines: ['Добро пожаловать в пекарню! Возьми тёплую булочку в дорогу.', 'Загляни в тихий переулок за углом — там часто находят старинные ключи.'] }] },
      alley: { title: 'Тихий переулок', exitHint: 'Узкий проход между домами. У корней старого дерева блестит предмет.', npcs: [{ name: 'Таинственный незнакомец', spr: 'npc2', coat: '#334155', hair: '#0F172A', x: 1.5, z: -10, item: 'Старинный ключ', lines: ['Не каждый сворачивает в этот переулок... Возьми этот ключ, он от ворот маяка.', 'Отнеси его Хранителю маяка на берегу моря за тоннелем.'] }] },
      sea: { title: 'Берег моря у маяка', exitHint: 'Солнце садится в океан, волны бьются о каменный пирс.', npcs: [{ name: 'Хранитель маяка', spr: 'npc2', coat: '#0284C7', hair: '#1E3A8A', x: 0, z: -8, lines: ['Ты прошёл сквозь тоннель! У тебя случайно нет старинного ключа от башни?', 'С этим ключом мы зажжём маяк и откроем следующую главу!'] }] }
    };
    function updHud() {
      const bag = INV.length ? ` • Сумка: ${INV.join(', ')}` : '';
      document.getElementById('hud-stat').textContent = `${WORLD_MAP[curLoc].title}${bag}`;
    }
    function goLoc(id) {
      if (id === 'street' && WORLD_MAP.street.savedNpcs) npcs = WORLD_MAP.street.savedNpcs;
      else { if (curLoc === 'street') WORLD_MAP.street.savedNpcs = npcs; npcs = WORLD_MAP[id].npcs; }
      curLoc = id; player = { x: 0, z: 8 }; updHud();
    }
    function triggerAction() {
      const near = npcs.find(n => Math.hypot(n.x - player.x, n.z - player.z) < 5);
      if (near) {
        const opts = [{ label: 'Спросить о дальнейшем пути', fn: () => openVnCard(near.name, `«${near.lines || 'Иди вперёд и исследуй каждый поворот этой локации.'}»`, [{ label: 'Продолжить' }]) }];
        if (near.item && !INV.includes(near.item)) opts.unshift({ label: `Взять предмет: ${near.item}`, fn: () => { INV.push(near.item); updHud(); openVnCard('Предмет получен', `В вашу сумку добавлен предмет: «${near.item}».`, [{ label: 'Отлично' }]); } });
        if (near.name === 'Хранитель маяка' && INV.includes('Старинный ключ')) opts.unshift({ label: 'Передать Старинный ключ и зажечь маяк', fn: () => openVnCard('Квест главы выполнен!', 'Луч маяка прорезал закатное небо над морем. Первая глава 2.5D-истории успешно завершена!', [{ label: 'Вернуться в игру' }]) });
        opts.push({ label: 'Завершить разговор' });
        openVnCard(`Диалог • ${near.name}`, `«${near.lines}»`, opts);
        return;
      }
      if (curLoc === 'street') {
        if (player.x < -2.6 && player.z < 4) openVnCard('Дверь в Пекарню', 'Из приоткрытой двери тянет теплом и ароматом ванили.', [{ label: 'Зайти внутрь пекарни', fn: () => goLoc('bakery') }, { label: 'Остаться на улице' }]);
        else if (player.x > 2.6 && player.z < -4) openVnCard('Вход в Переулок', 'Узкая тропинка уходит вглубь квартала.', [{ label: 'Свернуть в переулок', fn: () => goLoc('alley') }, { label: 'Остаться на улице' }]);
        else if (player.z < -22) openVnCard('Старый каменный тоннель', 'За аркой слышен шум морского прибоя.', [{ label: 'Пройти к берегу моря', fn: () => goLoc('sea') }, { label: 'Остаться на улице' }]);
        else openVnCard('Главная улочка', WORLD_MAP.street.exitHint, [{ label: 'Понятно' }]);
      } else {
        openVnCard(WORLD_MAP[curLoc].title, `${WORLD_MAP[curLoc].exitHint} Вернуться обратно на главную улочку?`, [{ label: 'Выйти на главную улочку', fn: () => goLoc('street') }, { label: 'Остаться здесь' }]);
      }
    }



    const jz = document.getElementById('joy-zone'), js = document.getElementById('joy-stick');
    jz.addEventListener('touchmove', e => { const r = jz.getBoundingClientRect(), t = e.touches.item(0); const dx = Math.max(-35, Math.min(35, t.clientX - r.left - 55)), dy = Math.max(-35, Math.min(35, t.clientY - r.top - 55)); js.style.transform = `translate(${dx}px, ${dy}px)`; move = { x: dx / 35, z: dy / 35 }; }, { passive: true });
    jz.addEventListener('touchend', () => { js.style.transform = 'translate(0,0)'; move = { x: 0, z: 0 }; });
    function openPortals() {
      const sectors = [
        { name: 'Центральная площадь (Мой респаун)', fn: () => goLoc('street') },
        { name: 'Кафе и Лавка снаряжения (@Master_Ufa)', fn: () => goLoc('bakery') },
        { name: 'Тихий переулок для встреч (@Alisa_Novels)', fn: () => goLoc('alley') },
        { name: 'Берег моря у маяка (@Keeper_Sea)', fn: () => goLoc('sea') }
      ];
      openVnCard('Порталы MX-Оазиса', 'Выберите сектор для мгновенного перемещения или создайте свой через «+ Моя локация»:', sectors.map(s => ({ label: s.name, fn: s.fn })).concat([{ label: 'Закрыть' }]));
    }
    onkeydown = e => { const k = e.key.toLowerCase(); if (k === 'arrowup' || k === 'w' || k === 'ц') move.z = -1; if (k === 'arrowdown' || k === 's' || k === 'ы') move.z = 1; if (k === 'arrowleft' || k === 'a' || k === 'ф') move.x = -1; if (k === 'arrowright' || k === 'd' || k === 'в') move.x = 1; };
    onkeyup = () => { move = { x: 0, z: 0 }; };
    setTimeout(buildWorld, 60);
  </script>
